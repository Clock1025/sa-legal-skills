name: v0.2 Alpha preparation and release

on:
  pull_request:
    branches: [develop-0.2]
    paths:
      - '.github/workflows/alpha-v02.yml'
      - 'scripts/prepare_alpha.py'
      - 'tests/test_alpha_release.py'
      - 'docs/releases/**'
      - 'START-HERE.md'
  push:
    tags: ['v0.2.0-alpha.2']

permissions:
  contents: read

concurrency:
  group: v0.2.0-alpha.2-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'Clock1025/sa-legal-skills'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Select integrated PR base or exact tag commit
        id: source
        env:
          SELECTED_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
        run: echo "commit=$SELECTED_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Checkout reviewed workflow and release instructions
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Checkout exact source with full integration history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.source.outputs.commit }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source, run all checks and prepare immutable artifacts
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          git -C release-source fetch --no-tags origin refs/heads/develop-0.2:refs/remotes/origin/develop-0.2
          python3 scripts/prepare_alpha.py --source release-source --commit "$SOURCE_COMMIT" --output test-output/alpha
          (cd test-output/alpha && sha256sum --check --strict SHA256SUMS.txt)
      - name: Retain candidate assets, source and release notes for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v0.2.0-alpha.2-candidate
          path: test-output/alpha/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: prepare
    if: github.event_name == 'push' && github.repository == 'Clock1025/sa-legal-skills' && github.ref == 'refs/tags/v0.2.0-alpha.2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: v0.2.0-alpha.2
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: v0.2.0-alpha.2-candidate
          path: package
      - name: Recheck artifact identity and refuse an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd package && sha256sum --check --strict SHA256SUMS.txt)
          test "$(cat package/SOURCE_COMMIT.txt)" = "$SOURCE_COMMIT"
          python3 - <<'PY'
          import os
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          repo, tag = os.environ['GH_REPO'], os.environ['RELEASE_TAG']
          for endpoint in (f'releases/tags/{tag}',):
              request = Request(f'https://api.github.com/repos/{repo}/{endpoint}', headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              try:
                  with urlopen(request, timeout=20):
                      raise SystemExit(f'FAIL: {endpoint} exists; refusing overwrite')
              except HTTPError as error:
                  if error.code != 404:
                      raise SystemExit(f'FAIL: cannot verify {endpoint}: HTTP {error.code}')
          PY
      - name: Verify exact existing tag and draft assets before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Peel lightweight or annotated tags through the commit endpoint.
          test "$(gh api "repos/${GH_REPO}/commits/${RELEASE_TAG}" --jq .sha)" = "$SOURCE_COMMIT"
          gh release create "$RELEASE_TAG" package/sa-legal-skills.zip package/SHA256SUMS.txt \
            --repo "$GH_REPO" --verify-tag --draft --prerelease --latest=false \
            --title 'v0.2.0-alpha.2 — Google Docs 母版與雙文件封閉試用' --notes-file package/RELEASE-NOTES.md
          test "$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '[.isDraft,.isPrerelease] | join(",")')" = 'true,true'
          test "$(gh release view "$RELEASE_TAG" --json assets --jq '[.assets[].name] | sort | join(",")')" = 'SHA256SUMS.txt,sa-legal-skills.zip'
          gh release download "$RELEASE_TAG" --dir downloaded --pattern sa-legal-skills.zip --pattern SHA256SUMS.txt
          (cd downloaded && sha256sum --check --strict SHA256SUMS.txt)
          cmp package/sa-legal-skills.zip downloaded/sa-legal-skills.zip
          cmp package/SHA256SUMS.txt downloaded/SHA256SUMS.txt
          latest_before="$(gh api "repos/${GH_REPO}/releases/latest" --jq .tag_name)"
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          test "$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '[.isDraft,.isPrerelease] | join(",")')" = 'false,true'
          test "$(gh api "repos/${GH_REPO}/releases/latest" --jq .tag_name)" = "$latest_before"
