name: Beta Pre-release
on:
  push:
    tags: ['v*.*.*-beta.*']
permissions:
  contents: read
concurrency:
  group: beta-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check Beta tag, develop ancestry, and complete package validation
        env:
          BETA_TAG: ${{ github.ref_name }}
        run: python3 scripts/validate.py --beta-tag "$BETA_TAG"
      - name: Run all smoke and negative tests
        run: python3 -m unittest discover -s tests -v
      - name: Prepare checksum
        run: |
          mkdir -p test-output/beta
          cp sa-legal-skills.zip test-output/beta/
          cd test-output/beta
          sha256sum sa-legal-skills.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: beta-package
          path: test-output/beta/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: validate
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: beta-package
          path: package
      - name: Verify artifact checksum
        working-directory: package
        run: sha256sum --check SHA256SUMS.txt
      - name: Refuse existing Release and publish verified Beta
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BETA_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.request
          url = f"https://api.github.com/repos/{os.environ['GH_REPO']}/releases/tags/{os.environ['BETA_TAG']}"
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          try:
              with urllib.request.urlopen(request):
                  raise SystemExit('FAIL: Release already exists; refusing to overwrite. Inspect the existing Release.')
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise SystemExit(f'FAIL: cannot check existing Release (HTTP {error.code})')
          PY
          cat > notes.md <<'NOTES'
          ## 版本定位

          本版為實驗性 Beta Pre-release，供實際模型測試、蒐集缺陷及改進 Agent Skills 使用。
          發布不代表已通過 RC 驗收；穩定版發布仍須維護者明確核准。
          本工作流使用 --latest=false，不將本版設為 Latest；穩定版與 Latest 請以 GitHub 實際標記為準。

          ## 自動化驗證

          自動化檢查：PASS。

          已檢查必要來源檔案、Skill metadata 與入口參照、固定 ZIP 成員、來源位元組一致性、
          CRC 完整性、解壓縮、兩次獨立建置的 SHA-256、全部單元與負例測試、
          Beta Tag 格式，以及 Tag Commit 的 develop 歷史來源；發布附件已通過 SHA-256 核對。

          自動化 PASS 不代表法律正確性、真人模型驗收或 DOCX 視覺品質 PASS。

          ## 真人模型驗收狀態

          真人模型驗收狀態：UNVERIFIED（未驗證）。

          本工作流不讀取或核對真人模型測試的原始證據，不能據此判定是否已進行實測或是否通過。
          若已有人工測試，請由維護者另行補充案例、平台／模型、Skill Commit、原始證據位置、
          獨立判定與限制；缺少可核對證據的項目維持未驗證，不沿用歷史結果冒充本版重新測試。

          DOCX 生成、條文保真、字型、跨頁版面及實際視覺品質須對本版模型產物另行驗收。
          尚未實際渲染並查看頁面的項目應標示 VISUAL QA: NOT TESTED；局部檢查須揭露範圍。

          ## 下載與使用限制

          - sa-legal-skills.zip：Skill 套件。
          - SHA256SUMS.txt：下載後核對 ZIP 的 SHA-256。

          使用者仍須自行核對法規來源、制度政策及最終文件；AI 不代替政策決定或正式法定程序。
          NOTES
          gh release create "$BETA_TAG" package/sa-legal-skills.zip package/SHA256SUMS.txt \
            --repo "$GH_REPO" --verify-tag --prerelease --latest=false \
            --title "$BETA_TAG" --notes-file notes.md
