name: Validate Agent Skills

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Structure and diff checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out submitted revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Skill repository structure
        run: python scripts/check_skill_repository.py

      - name: Check commit diff for whitespace errors
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA"...HEAD
